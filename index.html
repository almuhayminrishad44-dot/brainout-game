<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mind Blow</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  font-family:'Comic Sans MS', Arial;
  background: linear-gradient(135deg,#74b9ff,#a29bfe);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.game-card{
  width:95%;
  max-width:420px;
  background:#ffffff;
  border-radius:25px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
  animation: pop .5s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.level-badge{
  background:#6c5ce7;
  color:#fff;
  padding:6px 14px;
  border-radius:20px;
  font-size:14px;
}

.stars{
  font-size:18px;
  color:#fdcb6e;
}

.question{
  margin:25px 0;
  font-size:22px;
  text-align:center;
  color:#2d3436;
}

input{
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:15px;
  border:2px solid #dfe6e9;
  outline:none;
}

.buttons{
  margin-top:15px;
  display:flex;
  gap:10px;
}

button{
  flex:1;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:18px;
  cursor:pointer;
}

.ok-btn{
  background:#00b894;
  color:white;
}

.hint-btn{
  background:#ffeaa7;
  color:#2d3436;
}

.ok-btn:active,
.hint-btn:active{
  transform:scale(.95);
}

.footer{
  margin-top:15px;
  text-align:center;
  font-size:12px;
  color:#636e72;
}
</style>
</head>

<body>

<div class="game-card">
  <div class="top-bar">
    <div class="level-badge">Level <span id="lvl">1</span></div>
    <div class="stars" id="stars">⭐⭐⭐</div>
  </div>

  <div class="question" id="q">
    What is 1 + 1 ?
  </div>

  <input id="ans" placeholder="Type your answer">

  <div class="buttons">
    <button class="hint-btn" onclick="hint()">💡 Hint</button>
    <button class="ok-btn" onclick="check()">OK</button>
  </div>

  <div class="footer">
    Mind Blow © 2026
  </div>
</div>

</body>
            
<script>
let level = Number(localStorage.getItem("level")) || 1;
let stars = Number(localStorage.getItem("stars")) || 3;
let waitTimer;

function load(){
  document.getElementById("lvl").innerText = level;
  document.getElementById("stars").innerText = "⭐".repeat(stars);
  q.innerHTML="";
  ans.value="";
  clearTimeout(waitTimer);

  if(level > 100){
    q.innerHTML = "🎉 YOU ARE A BRAIN MASTER!";
    return;
  }

  if(level % 20 === 0){
    q.innerHTML = "Don't touch anything for 3 seconds";
    waitTimer = setTimeout(pass,3000);
  }
  else if(level % 15 === 0){
    q.innerHTML = "Tap the word <span onclick='pass()'>THIS</span>, not the button";
  }
  else if(level % 10 === 0){
    q.innerHTML = "Type the wrong answer";
  }
  else{
    q.innerHTML = `What is ${level}+${level}?`;
  }
}

function check(){
  if(level % 10 === 0 && ans.value != level*2) pass();
  else if(ans.value == level*2) pass();
  else wrong();
}

function hint(){
  if(stars > 0){
    stars--;
    alert("Think opposite 😏");
    localStorage.setItem("stars",stars);
    load();
  } else {
    alert("No hints left!");
  }
}

function wrong(){
  document.body.style.animation="shake .3s";
  setTimeout(()=>document.body.style.animation="",300);
  alert("❌ Brain Failed!");
}

function pass(){
  level++;
  localStorage.setItem("level",level);
  load();
}

load();
</script></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mind Blow v4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Comic Sans MS', Arial;
  background: linear-gradient(135deg,#74b9ff,#a29bfe);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.game-card{
  width:95%;
  max-width:420px;
  background:#ffffff;
  border-radius:25px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
  animation: pop .5s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.level-badge{
  background:#6c5ce7;
  color:#fff;
  padding:6px 14px;
  border-radius:20px;
  font-size:14px;
}

.stars{
  font-size:18px;
  color:#fdcb6e;
}

.question{
  margin:20px 0;
  font-size:22px;
  text-align:center;
  color:#2d3436;
}

input{
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:15px;
  border:2px solid #dfe6e9;
}

.buttons{
  margin-top:15px;
  display:flex;
  gap:10px;
}

button{
  flex:1;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:18px;
  cursor:pointer;
}

.ok-btn{background:#00b894;color:white;}
.hint-btn{background:#ffeaa7;color:#2d3436;}
.reset-btn{background:#d63031;color:white;}

.footer{
  margin-top:15px;
  text-align:center;
  font-size:12px;
  color:#636e72;
}
</style>
</head>

<body>

<audio id="bgm" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop autoplay></audio>
<audio id="correct" src="https://www.soundjay.com/button/sounds/button-3.mp3"></audio>
<audio id="wrong" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

<div class="game-card">

  <div class="top-bar">
    <button class="reset-btn" onclick="resetProgress()">🔄 Reset Progress</button>
    <div class="level-badge">Level <span id="lvl">1</span></div>
    <div class="stars" id="stars">⭐⭐⭐</div>
  </div>

  <div class="question" id="q"></div>

  <input id="ans" placeholder="Your answer">

  <div class="buttons">
    <button class="hint-btn" onclick="hint()">💡 Hint</button>
    <button class="ok-btn" onclick="check()">OK</button>
  </div>

  <div class="footer">Mind Blow © 2026</div>
</div>

<script>
let level = Number(localStorage.getItem("level")) || 1;
let stars = Number(localStorage.getItem("stars")) || 3;
const maxLevel = 150;
let firstLoad = true; // For first UI view

function load(){
  document.getElementById("lvl").innerText = level;
  document.getElementById("stars").innerText = "⭐".repeat(stars);
  document.getElementById("ans").value = "";
  const qEl = document.getElementById("q");

  // Show first UI if page just loaded
  if(firstLoad){
    qEl.innerText = "🎮 Welcome to Mind Blow! Try to solve tricky puzzles!";
    firstLoad = false;
    return;
  }

  if(level > maxLevel){
    qEl.innerText = "🎉 You are a Brain Master!";
    return;
  }

  // Tricky hard levels from level 1
  if(level % 20 === 0){
    qEl.innerText = "Don't touch anything for 3 sec!";
    setTimeout(pass, 3000);
  }
  else if(level % 15 === 0){
    qEl.innerHTML = `Tap the word <span onclick='pass()' style="color:#d63031;cursor:pointer;">CLICK ME</span>`;
  }
  else if(level % 10 === 0){
    qEl.innerText = "Type a wrong answer!";
  }
  else if(level % 7 === 0){
    qEl.innerText = `Drag the pink box to green box`; // Implement drag later
  }
  else{
    qEl.innerText = `What is ${level}+${level*2}?`;
  }
}

function check(){
  let ansValue = document.getElementById("ans").value;
  if(level % 10 === 0 && ansValue != level*2){
    pass();
    document.getElementById("correct").play();
  }
  else if(ansValue == level*2){
    pass();
    document.getElementById("correct").play();
  } else {
    wrong();
  }
}

function wrong(){
  alert("❌ Try Again!");
  document.getElementById("wrong").play();
}

function hint(){
  if(stars > 0){
    stars--;
    localStorage.setItem("stars", stars);
    alert("Think outside the box 😏");
    load();
  } else alert("No hints left!");
}

function pass(){
  level++;
  localStorage.setItem("level", level);
  localStorage.setItem("stars", stars);
  load();
}

function resetProgress(){
  localStorage.removeItem("level");
  localStorage.removeItem("stars");
  level = 1;
  stars = 3;
  firstLoad = true;
  load();
  alert("✅ Progress reset!");
}

// Show first UI on load
window.onload = load;

</script>

</body>
</html>
